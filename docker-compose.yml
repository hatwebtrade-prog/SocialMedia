services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agocap
      POSTGRES_PASSWORD: agocap
      POSTGRES_DB: agocap
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agocap"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      DATABASE_URL: "postgresql://agocap:agocap@db:5432/agocap?schema=public"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      SEOZOOM_API_KEY: "${SEOZOOM_API_KEY}"
      SHOPIFY_SHOP_DOMAIN: "${SHOPIFY_SHOP_DOMAIN}"
      SHOPIFY_ADMIN_TOKEN: "${SHOPIFY_ADMIN_TOKEN}"
      SHOPIFY_STORE_URL: "${SHOPIFY_STORE_URL}"
      N8N_WEBHOOK_SECRET: "${N8N_WEBHOOK_SECRET}"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && node server.js"

volumes:
  pgdata:
  uploads:
